name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # T1/T4: fail fast if any CI-referenced test file does not exist, so the
      # pipeline can never again go red by referencing never-committed tests.
      - name: Preflight — referenced test files exist
        run: ./scripts/ci/check_referenced_tests_exist.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Run multi-agent frontend hardening test gate
        run: ./scripts/ci/check_multiagent_frontend_hardening.sh

      # T3: frontend suite WITH coverage (provider + thresholds wired in vite.config.ts).
      - name: Run frontend tests with coverage
        run: npm run test:ci

      - name: Install backend dependencies
        # T2: install requirements-dev.txt too, so pytest-asyncio / pytest-cov are
        # present — otherwise async tests are collected but never awaited, and the
        # coverage gate cannot run.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Compile backend workflow contract paths
        run: python3 -m compileall backend/app/routers/ai/workflows.py backend/app/services/agent

      - name: Run targeted gemini-client-pool unification gate
        run: cd backend && PYTHONPATH=. python3 -m pytest tests/test_gemini_client_pool_usage.py -v

      # T1/T2/T3: the real backend suite (async tests now run via asyncio_mode=auto)
      # WITH a coverage floor enforced (--cov-fail-under is set in the npm script).
      - name: Run backend tests with coverage
        run: npm run test:backend:cov
