name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"

          # 使用变量存储正则表达式，避免转义问题
          REGEX='^(feat|fix|docs|style|refactor|test|chore)(\([^)]+\))?: .+'

          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "❌ PR title does not follow conventional commits format"
            echo ""
            echo "Expected format:"
            echo "  type(scope): description"
            echo ""
            echo "Valid types:"
            echo "  - feat: A new feature"
            echo "  - fix: A bug fix"
            echo "  - docs: Documentation only changes"
            echo "  - style: Code style changes (formatting, etc.)"
            echo "  - refactor: Code refactoring"
            echo "  - test: Adding or updating tests"
            echo "  - chore: Other changes (build, CI, etc.)"
            echo ""
            echo "Examples:"
            echo "  ✅ feat: add user authentication"
            echo "  ✅ feat(auth): add login page"
            echo "  ✅ fix: resolve memory leak in image processing"
            echo "  ✅ docs: update README with installation guide"
            echo ""
            echo "Your PR title: $PR_TITLE"
            exit 1
          fi

          echo "✅ PR title format is correct: $PR_TITLE"

  gemini-pool-gate:
    # PR 阶段独立快速 gate：让"主链路新增 genai.Client(...)"或"包装类绕过统一池"
    # 在 PR 反馈中就 fail，不等完整 CI 跑完。镜像 ci.yml 中同名 step。
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements.txt pytest

      - name: Run targeted gemini-client-pool unification gate
        run: cd backend && PYTHONPATH=. python3 -m pytest tests/test_gemini_client_pool_usage.py -v
