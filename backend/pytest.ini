[pytest]
testpaths = tests
# T2: async tests must actually run. Without this (and pytest-asyncio installed)
# @pytest.mark.asyncio coroutines are collected but never awaited.
asyncio_mode = auto
# Only collect real test modules; manual_*/probe scripts are excluded by this glob.
python_files = test_*.py
# T2: turn RuntimeWarnings raised during a test (e.g. an un-awaited coroutine
# dropped inside the test body) into hard errors so an accidentally-dropped
# `await` fails the suite loudly instead of leaking past CI. Note: a coroutine
# only garbage-collected at interpreter shutdown is reported via the unraisable
# hook (PytestUnraisableExceptionWarning) and is not escalated here on purpose,
# to avoid failing on unrelated shutdown-time resource warnings.
filterwarnings =
    error::RuntimeWarning
    ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3.17:DeprecationWarning:google\.genai\.types
